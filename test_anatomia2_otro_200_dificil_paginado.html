rificios", "Vasa vasorum de la adventicia", "Válvulas venosas", "Esfínter precapilar"], "answer": 0}, {"q": "Una arteria lesionada reduce de forma inmediata la pérdida de sangre gracias a:", "options": ["Vasoespasmo de la pared arterial", "Aumento de la filtración capilar", "Apertura de anastomosis venosas", "Activación del conducto torácico"], "answer": 0}, {"q": "La túnica que más varía entre los distintos vasos sanguíneos es la:", "options": ["Media", "Íntima", "Adventicia", "Membrana basal"], "answer": 0}, {"q": "¿Qué afirmación diferencia mejor una arteria elástica de una muscular?", "options": ["La muscular tiene más músculo liso y menos elastina", "La elástica carece de túnica media", "La muscular es siempre de mayor calibre que la aorta", "La elástica sólo se encuentra en capilares"], "answer": 0}, {"q": "Las arterias elásticas reciben el nombre de arterias de conducción porque:", "options": ["Transportan sangre desde el corazón hacia arterias medianas", "Conectan directamente capilares y vénulas", "Sólo distribuyen sangre al sistema locomotor", "Carecen de respuesta a la presión"], "answer": 0}, {"q": "Una arteriola se considera vaso de resistencia principalmente por:", "options": ["La regulación simpática de su diámetro", "Su abundancia de válvulas", "Su membrana basal incompleta", "Su alto contenido de glóbulos blancos"], "answer": 0}, {"q": "Si los esfínteres precapilares están contraídos, lo esperable es que:", "options": ["Disminuya el flujo hacia los capilares", "Aumente la entrada de sangre al lecho capilar", "Se cierre la vena cava superior", "Se active la cisterna de quilo"], "answer": 0}, {"q": "En reposo, la mayor parte de un lecho capilar:", "options": ["Permanece sin utilizarse completamente", "Recibe el 100% del flujo máximo", "Carece de metaarteriola", "No depende de esfínteres"], "answer": 0}, {"q": "La ausencia de anastomosis en una arteria implica que se trata de una arteria:", "options": ["Terminal", "De conducción", "Fenestrada", "Bronco común derecha", "Carótida común izquierda y subclavia izquierda", "Vertebral izquierda y basilar", "Carótida interna derecha y externa derecha"], "answer": 0}, {"q": "La carótida común se bifurca a nivel del borde superior del:", "options": ["Cartílago tiroides", "Cartílago cricoides", "Primer cartílago costal", "Foramen magno"], "answer": 0}, {"q": "El seno carotídeo actúa como:", "options": ["Barorreceptor", "Quimiorreceptor intestinal", "Esfínter precapilar", "Conducto linfático"], "answer": 0}, {"q": "Una lesión de la carótida externa afectaría más directamente a la irrigación de:", "options": ["Cara, cavidad oral y glándula tiroides", "Corteza occipital profunda", "Tálamo y mesencéfalo", "Miocardio"], "answer": 0}, {"q": "La carótida interna se caracteriza porque en el cuello:", "options": ["No emite ramas colaterales", "Da seis ramas colaterales", "Se divide en temporal superficial y maxilar", "Irriga únicamente músculos faciales"], "answer": 0}, {"q": "La arteria cerebral media es descrita como:", "options": ["Rama terminal de la carótida interna y la más voluminosa", "Rama del tronco celíaco", "Rama de la carótida externa", "Rama directa del cayado aórtico"], "answer": 0}, {"q": "El polígono de Willis conecta principalmente:", "options": ["Sistema carotídeo interno y vertebrobasilar", "Sistema cava superior e inferior", "Sistema porta y ácigos", "Sistema coronario derecho e izquierdo"], "answer": 0}, {"q": "La arteria comunicante anterior une directamente:", "options": ["Las cerebrales anteriores derecha e izquierda", "Las cerebrales posteriores", "Las vertebrales", "La basilar con la oftálmica"], "answer": 0}, {"q": "El arco posterior del polígono de Willis incluye:", "options": ["Cerebrales posteriores y comunicantes posteriores", "Temporales superficiales y maxilares", "Faciales y linguales", "Coronarias y carótidas externas"], "answer": 0}, {"q": "Las arterias cerebrales posteriores se originan por bifurcación de la:", "options": ["Arteria basilar", "Arteria facial", "Arteria carótida externa", "Arteria subclavia"], "answer": 0}, {"q": "La arteria vertebral penetra en el cráneo a través del:", "options": ["Foramen magno", "Foramen oval", "Foramen infraorbitario", "Foramen incisivo"], "answer": 0}, {"q": "La arteria mamaria interna desciende:", "options": ["Detrás de los cartílagos costales de las seis primeras costillas", "Por el compartimento anterior de la pierna", "Dentro del conducto mandibular", "A través del ligamento inguinal"], "answer": 0}, {"q": "La arteria axilar comienza cuando la subclavia cruza:", "options": ["El borde externo de la primera costilla", "El hiato aórtico", "El foramen carotídeo", "El borde inferior del sartorio"], "answer": 0}, {"q": "La arteria axilar termina al cruzar el borde distal del músculo:", "options": ["Redondo mayor", "Temporal", "Masetero", "Sóleo"], "answer": 0}, {"q": "La arteria humeral termina en la bifurcación de:", "options": ["Radial y cubital", "Femoral y poplítea", "Subclavia y axilar", "Carótida interna y externa"], "answer": 0}, {"q": "La arteria braquial es útil clínicamente para:", "options": ["Tomar la tensión arterial en la fosa cubital", "Medir la presión intracraneal", "Drenar la linfa intestinal", "Palpar la safena mayor"], "answer": 0}, {"q": "El pulso radial se palpa con facilidad porque la arteria radial:", "options": ["Contacta con el extremo distal del radio y está cubierta sólo por fascia y piel", "Pasa profunda al sacro", "Se ubica dentro del mediastino posterior", "Es la rama más profunda de la cubital"], "answer": 0}, {"q": "El arco palmar superficial depende principalmente de la arteria:", "options": ["Cubital", "Radial", "Braquial profunda", "Axilar"], "answer": 0}, {"q": "El arco palmar profundo surge principalmente de la rama profunda de la arteria:", "options": ["Radial", "Cubital", "Subclavia", "Mamaria interna"], "answer": 0}, {"q": "La aorta torácica da ramas parietales para:", "options": ["Pared corporal", "Vísceras digestivas exclusivamente", "Encéfalo", "Miembros superiores"], "answer": 0}, {"q": "Las arterias intercostales posteriores de la aorta torácica nacen desde el tercer espacio intercostal hasta el:", "options": ["Undécimo", "Séptimo", "Duodécimo", "Primero"], "answer": 0}, {"q": "Las arterias subcostales corresponden al espacio:", "options": ["Duodécimo intercostal", "Tercero intercostal", "Séptimo intercostal", "Primer intercostal"], "answer": 0}, {"q": "Entre las ramas viscerales de la aorta torácica se encuentran las:", "options": ["Esofágicas y bronquiales", "Lumbares y sacra media", "Gonadales y renales", "Tibiales y peroneas"], "answer": 0}, {"q": "La aorta abdominal se extiende desde el hiato aórtico hasta:", "options": ["L4", "T4", "C7", "S5"], "answer": 0}, {"q": "El tronco celíaco se divide inmediatamente en:", "options": ["Gástrica izquierda, esplénica y hepática común", "Renal, gonadal y suprarrenal", "Lumbar, frénica e ilíaca", "Mesentérica superior, inferior y sacra media"], "answer": 0}, {"q": "La arteria gástrica izquierda se relaciona con:", "options": ["Curvatura menor del estómago", "Curvatura mayor exclusivamente", "Colon descendente", "Riñón derecho"], "answer": 0}, {"q": "La arteria esplénica discurre hacia el bazo por debajo de:", "options": ["Páncreas", "Diafragma", "Cartílago tiroides", "Ligamento inguinal"], "answer": 0}, {"q": "La arteria mesentérica superior nace aproximadamente:", "options": ["1 cm por debajo del tronco celíaco, a nivel L1", "A nivel L4 en la bifurcación aórtica", "Desde el arco aórtico", "Desde la arteria ilíaca interna"], "answer": 0}, {"q": "La arteria mesentérica inferior nace a nivel de:", "options": ["L3", "L1", "T12", "C4"], "answer": 0}, {"q": "La arteria renal derecha suele ser más larga porque:", "options": ["Debe pasar por detrás de la vena cava", "Nace del tronco celíaco", "Irriga también el bazo", "Cruza el foramen magno"], "answer": 0}, {"q": "Las arterias gonadales nacen:", "options": ["Por debajo de las arterias renales", "Por e options": ["Debe cruzar hacia la aurícula derecha", "Nace en la pierna izquierda", "Recorre el conducto vertebral", "Atraviesa el hiato sacro"], "answer": 0}, {"q": "La yugular interna recoge aproximadamente la sangre intracraneal en un:", "options": ["95%", "25%", "50%", "10%"], "answer": 0}, {"q": "La yugular interna se encuentra en la vaina carotídea junto con:", "options": ["Carótida común y nervio vago", "Arteria radial y nervio mediano", "Vena porta y colédoco", "Vena safena y nervio femoral"], "answer": 0}, {"q": "La vena yugular externa se forma por:", "options": ["Vena retromandibular y auricular posterior", "Seno coronario y cava inferior", "Venas tibiales anterior y posterior", "Venas hepáticas"], "answer": 0}, {"q": "El arco venoso yugular comunica:", "options": ["Ambas yugulares anteriores", "Ambas safenas mayores", "Las venas pulmonares", "Las venas gonadales"], "answer": 0}, {"q": "En el miembro superior, las venas profundas suelen ser:", "options": ["Pares y satélites de las arterias", "Únicas y superficiales", "Sin válvulas", "Exclusivas de la mano"], "answer": 0}, {"q": "La vena cefálica asciende por el lateral del brazo y termina en:", "options": ["Vena axilar", "Vena porta", "Vena femoral", "Vena hemiácigos"], "answer": 0}, {"q": "La vena basílica se hace profunda y se une a venas humerales para formar:", "options": ["Vena axilar", "Vena cava superior", "Vena safena externa", "Vena ácigos"], "answer": 0}, {"q": "La vena mediana del antebrazo nace de:", "options": ["Red venosa de la porción palmar", "Seno sigmoideo", "Vena porta", "Arco venoso dorsal del pie"], "answer": 0}, {"q": "El sistema ácigos tiene importancia porque:", "options": ["Puede derivar sangre si se obstruye la cava inferior", "Sustituye a las arterias coronarias", "Drena directamente en la cava inferior", "Transporta quilo intestinal"], "answer": 0}, {"q": "Las venas intercostales anteriores forman la vena:", "options": ["Mamaria interna o torácica interna", "Hemiácigos accesoria ter(q.answer)}`;}w.appendChild(fb);}quiz.appendChild(w);}document.getElementById('btnPrev').disabled=currentPage===1;document.getElementById('btnNext').disabled=currentPage===totalPages;}function correctTest(showOnlyAnswers=false){corrected=true;let c=0,w=0,b=0;QUESTIONS.forEach((q,i)=>{if(userAnswers[i]===null)b++;else if(userAnswers[i]===q.answer)c++;else w++;});resultBox.style.display='block';scoreText.textContent=`Resultado: ${c} aciertos · ${w} fallos · ${b} en blanco · Nota: ${((c/QUESTIONS.length)*10).toFixed(2)} / 10`;summaryText.textContent=showOnlyAnswers?'Se han mostrado las soluciones.':`Has respondido ${QUESTIONS.length-b} de ${QUESTIONS.length} preguntas.`;renderPage();window.scrollTo({top:0,behavior:'smooth'});}function resetTest(){if(!confirm('¿Seguro que quieres reiniciar todo el test?'))return;for(let i=0;i<userAnswers.length;i++)userAnswers[i]=null;corrected=false;currentPage=1;resultBox.style.display='none';renderPage();window.scrollTo({top:0,behavior:'smooth'});}document.getElementById('btnPrev').onclick=()=>{if(currentPage>1){currentPage--;renderPage();window.scrollTo({top:0,behavior:'smooth'});}};document.getElementById('btnNext').onclick=()=>{const totalPages=Math.ceil(QUESTIONS.length/PER_PAGE);if(currentPage<totalPages){currentPage++;renderPage();window.scrollTo({top:0,behavior:'smooth'});}};document.getElementById('btnCorrect').onclick=()=>correctTest(false);document.getElementById('btnShowAnswers').onclick=()=>correctTest(true);document.getElementById('btnReset').onclick=resetTest;renderPage();</script></body></html>
